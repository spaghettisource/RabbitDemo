services:

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: apps
      POSTGRES_PASSWORD: appspwd
      POSTGRES_DB: ticketdemo
    ports:
      - "5434:5432"

  orderapi:
    build:
      context: .
      dockerfile: OrderApi/Dockerfile
    ports:
      - "8080:8080"
    environment:
      RabbitMq__Host: rabbitmq
      ASPNETCORE_URLS: http://+:8080
    depends_on:
      - rabbitmq

  orderworker:
    build:
      context: .
      dockerfile: OrderWorker/Dockerfile
    environment:
      RabbitMq__Host: rabbitmq
      ConnectionStrings__TicketDb: Host=postgres;Port=5432;Database=ticketdemo;Username=apps;Password=appspwd
    depends_on:
      - rabbitmq
      - postgres